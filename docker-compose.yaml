networks:
    openstatus:
        driver: bridge
        name: openstatus

volumes:
    libsql-data:
        name: openstatus-libsql-data
    redis-data:
        name: openstatus-redis-data
    workflows-data:
        name: openstatus-workflows-data
    tinybird-data:
        name: openstatus-tinybird-data
    tls-certs:
        name: openstatus-tls-certs

services:
    # External services
    libsql:
        container_name: openstatus-libsql
        image: ghcr.io/tursodatabase/libsql-server:latest
        networks:
            - openstatus
        ports:
            - "127.0.0.1:8080:8080"
            - "127.0.0.1:5001:5001"
        volumes:
            - libsql-data:/var/lib/sqld
        environment:
            - SQLD_NODE=primary
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'perl -e ''use IO::Socket::INET; exit(IO::Socket::INET->new(PeerAddr=>"127.0.0.1:8080",Timeout=>1) ? 0 : 1);''',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    tinybird-local:
        container_name: openstatus-tinybird-local
        image: tinybirdco/tinybird-local:latest
        platform: linux/amd64
        networks:
            - openstatus
        ports:
            - "127.0.0.1:7181:7181"
            - "127.0.0.1:8123:8123"
        environment:
            - COMPATIBILITY_MODE=1
        volumes:
            - tinybird-data:/var/lib/clickhouse
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:7181/"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        restart: unless-stopped

    redis:
        container_name: openstatus-redis
        image: redis/redis-stack-server:6.2.6-v6
        networks:
            - openstatus
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    redis-http:
        container_name: openstatus-redis-http
        image: hiett/serverless-redis-http:latest
        networks:
            - openstatus
        ports:
            - "127.0.0.1:8079:80"
        environment:
            - SRH_MODE=env
            - SRH_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-replace-with-a-long-random-secret}
            - SRH_CONNECTION_STRING=redis://redis:6379
        depends_on:
            redis:
                condition: service_healthy
        restart: unless-stopped

    db-migrate:
        container_name: openstatus-db-migrate
        image: oven/bun:1.3.6
        networks:
            - openstatus
        working_dir: /app/packages/db
        volumes:
            - .:/app
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
        command: ["sh", "-c", "bun install && bun run migrate"]
        depends_on:
            libsql:
                condition: service_healthy
        restart: "no"

    db-seed:
        container_name: openstatus-db-seed
        image: oven/bun:1.3.6
        networks:
            - openstatus
        working_dir: /app/packages/db
        volumes:
            - .:/app
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
        command: ["sh", "-c", "bun install && bun run seed"]
        profiles: ["seed"]
        depends_on:
            db-migrate:
                condition: service_completed_successfully
        restart: "no"

    unlock-self-hosted:
        container_name: openstatus-unlock-self-hosted
        image: oven/bun:1.3.6
        networks:
            - openstatus
        working_dir: /app/packages/db
        volumes:
            - .:/app
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
        command: ["sh", "-c", "bun install && bun run unlock"]
        profiles: ["unlock"]
        depends_on:
            db-migrate:
                condition: service_completed_successfully
        restart: "no"

    self-sign-tls:
        image: smallstep/step-cli:latest
        container_name: openstatus-self-sign-tls
        profiles: ["self-sign-tls"]
        user: root
        networks:
            - openstatus
        volumes:
            - tls-certs:/certs
        env_file:
            - .env.docker
        environment:
            - WILDCARD_DOMAIN=${WILDCARD_DOMAIN:-open.status}
        command:
            - sh
            - -c
            - |
                step certificate create "*.${WILDCARD_DOMAIN}" /certs/tls.crt /certs/tls.key \
                    --profile self-signed --subtle --not-after 8760h \
                    --force --no-password --insecure
                cat > /certs/dynamic.yaml << 'ENDYAML'
                tls:
                  stores:
                    default:
                      defaultCertificate:
                        certFile: /certs/tls.crt
                        keyFile: /certs/tls.key
                ENDYAML
                echo "Wildcard cert created for *.${WILDCARD_DOMAIN}"
        restart: "no"

    traefik:
        image: traefik:v3.6
        container_name: openstatus-traefik
        networks:
            - openstatus
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - tls-certs:/certs:ro
        command:
            - --log.level=DEBUG
            - --accesslog=true
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --providers.docker
            - --providers.docker.exposedbydefault=false
            - --providers.docker.network=openstatus
            - --providers.file.filename=/certs/dynamic.yaml
        restart: unless-stopped

    # Internal Services
    workflows:
        container_name: openstatus-workflows
        build:
            context: .
            dockerfile: apps/workflows/Dockerfile
        image: openstatus/workflows:latest
        networks:
            - openstatus
        ports:
            - "127.0.0.1:3000:3000"
        volumes:
            - workflows-data:/app/data
        env_file:
            - .env.docker
        environment:
            - CHECKER_URL=http://checker:8080
            - OPENSTATUS_WORKFLOWS_URL=http://workflows:3000
            - TINY_BIRD_API_KEY=${TINY_BIRD_API_KEY:-}
            - UPSTASH_REDIS_REST_URL=http://redis-http:80
            - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-replace-with-a-long-random-secret}
            - PORT=3000
        depends_on:
            db-migrate:
                condition: service_completed_successfully
            libsql:
                condition: service_healthy
            redis-http:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:3000/ping || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    server:
        container_name: openstatus-server
        build:
            context: .
            dockerfile: apps/server/Dockerfile
        image: openstatus/server:latest
        networks:
            - openstatus
        ports:
            - "127.0.0.1:3001:3000"
        env_file:
            - .env.docker
        environment:
            - OPENSTATUS_WORKFLOWS_URL=http://workflows:3000
            - UPSTASH_REDIS_REST_URL=http://redis-http:80
            - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-replace-with-a-long-random-secret}
            - PORT=3000
        depends_on:
            db-migrate:
                condition: service_completed_successfully
            workflows:
                condition: service_healthy
            libsql:
                condition: service_healthy
            redis-http:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:3000/ping || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    checker:
        container_name: openstatus-checker
        build:
            context: apps/checker
            dockerfile: Dockerfile
        image: openstatus/checker:latest
        networks:
            - openstatus
        ports:
            - "127.0.0.1:8082:8080"
        env_file:
            - .env.docker
        environment:
            - PORT=8080
            - CRON_SECRET=${CRON_SECRET:-your-random-cron-secret}
            - OPENSTATUS_WORKFLOWS_URL=http://workflows:3000
            - TINYBIRD_TOKEN=${TINY_BIRD_API_KEY:-}
            - TINYBIRD_URL=${TINYBIRD_URL:-http://tinybird-local:7181}
            - CLOUD_PROVIDER=fly
            - FLY_REGION=self-hosted
        depends_on:
            workflows:
                condition: service_healthy
            tinybird-local:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    private-probe:
        container_name: openstatus-private-probe
        build:
            context: apps/checker
            dockerfile: Dockerfile.probe
        image: openstatus/private-probe:latest
        networks:
            - openstatus
        env_file:
            - .env.docker
        environment:
            - OPENSTATUS_KEY=${PRIVATE_LOCATION_TOKEN:-${OPENSTATUS_KEY:-}}
            - OPENSTATUS_INGEST_URL=http://private-location:8080
            - LOG_LEVEL=debug
        depends_on:
            private-location:
                condition: service_healthy
        restart: unless-stopped

    private-probe-2:
        container_name: openstatus-private-probe-2
        build:
            context: apps/checker
            dockerfile: Dockerfile.probe
        image: openstatus/private-probe:latest
        networks:
            - openstatus
        env_file:
            - .env.docker
        environment:
            - OPENSTATUS_KEY=${PRIVATE_LOCATION_TOKEN_2:-${OPENSTATUS_KEY_2:-}}
            - OPENSTATUS_INGEST_URL=http://private-location:8080
            - LOG_LEVEL=debug
        depends_on:
            private-location:
                condition: service_healthy
        restart: unless-stopped

    private-probe-3:
        container_name: openstatus-private-probe-3
        build:
            context: apps/checker
            dockerfile: Dockerfile.probe
        image: openstatus/private-probe:latest
        networks:
            - openstatus
        env_file:
            - .env.docker
        environment:
            - OPENSTATUS_KEY=${PRIVATE_LOCATION_TOKEN_3:-${OPENSTATUS_KEY_3:-}}
            - OPENSTATUS_INGEST_URL=http://private-location:8080
            - LOG_LEVEL=debug
        depends_on:
            private-location:
                condition: service_healthy
        restart: unless-stopped

    private-location:
        container_name: openstatus-private-location
        build:
            context: apps/private-location
            dockerfile: Dockerfile
        image: openstatus/private-location:latest
        networks:
            - openstatus
        ports:
            - "127.0.0.1:8081:8080"
        env_file:
            - .env.docker
        environment:
            - DB_URL=http://libsql:8080
            - DB_AUTH_TOKEN=
            - TINYBIRD_TOKEN=${TINY_BIRD_API_KEY:-}
            - TINYBIRD_URL=${TINYBIRD_URL:-http://tinybird-local:7181}
            - OPENSTATUS_WORKFLOWS_URL=http://workflows:3000
            - CRON_SECRET=${CRON_SECRET:-your-random-cron-secret}
            - GIN_MODE=release
            - PORT=8080
        depends_on:
            db-migrate:
                condition: service_completed_successfully
            libsql:
                condition: service_healthy
            tinybird-local:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://localhost:8080/health",
                ]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    dashboard-deps-check:
        container_name: openstatus-dashboard-deps-check
        build:
            context: .
            dockerfile: apps/dashboard/Dockerfile
            target: deps-check
        image: openstatus/dashboard-deps-check:latest
        profiles: ["deps-check"]
        restart: "no"

    dashboard-typecheck:
        container_name: openstatus-dashboard-typecheck
        build:
            context: .
            dockerfile: apps/dashboard/Dockerfile
            target: typecheck
        image: openstatus/dashboard-typecheck:latest
        profiles: ["typecheck"]
        restart: "no"

    dashboard:
        container_name: openstatus-dashboard
        build:
            context: .
            dockerfile: apps/dashboard/Dockerfile
            target: runtime
            args:
                - NODE_ENV=production
                - PNPM_HOME=/pnpm
                - DATABASE_URL=http://libsql:8080
                - DATABASE_AUTH_TOKEN=test
                - NEXT_PUBLIC_OPENPANEL_CLIENT_ID=test
                - NEXT_PUBLIC_URL=https://openstatus.open.status
                - TEAM_ID_VERCEL=test
                - PROJECT_ID_VERCEL=test
                - VERCEL_AUTH_BEARER_TOKEN=test
                - OPENPANEL_CLIENT_SECRET=test
                - RESEND_API_KEY=test
                - UPSTASH_REDIS_REST_URL=https://test.upstash.io
                - UPSTASH_REDIS_REST_TOKEN=test
                - UNKEY_TOKEN=test
                - UNKEY_API_ID=test
                - TINY_BIRD_API_KEY=
                - CRON_SECRET=test
                - STRIPE_SECRET_KEY=test
                - AUTH_SECRET=${AUTH_SECRET}
                - SELF_HOST=true
        image: openstatus/dashboard:latest
        networks:
            - openstatus
        ports:
            - "127.0.0.1:3002:3000"
        labels:
            - traefik.enable=true
            - traefik.http.routers.dashboard.rule=Host(`openstatus.openstat.us`)
            - traefik.http.routers.dashboard.entrypoints=web,websecure
            - traefik.http.routers.dashboard.tls=true
            - traefik.http.services.dashboard.loadbalancer.server.port=3000
        env_file:
            - .env.docker
        environment:
            - PORT=3000
            - HOSTNAME=0.0.0.0
            - AUTH_TRUST_HOST=true
            - AUTH_DEBUG=true
            - CHECKER_URL=http://checker:8080
            - UPSTASH_REDIS_REST_URL=http://redis-http:80
            - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-replace-with-a-long-random-secret}
        depends_on:
            db-migrate:
                condition: service_completed_successfully
            workflows:
                condition: service_healthy
            libsql:
                condition: service_healthy
            server:
                condition: service_healthy
            redis-http:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 45s
        restart: unless-stopped

    status-page-deps-check:
        container_name: openstatus-status-page-deps-check
        build:
            context: .
            dockerfile: apps/status-page/Dockerfile
            target: deps-check
        image: openstatus/status-page-deps-check:latest
        profiles: ["deps-check"]
        restart: "no"

    status-page-typecheck:
        container_name: openstatus-status-page-typecheck
        build:
            context: .
            dockerfile: apps/status-page/Dockerfile
            target: typecheck
        image: openstatus/status-page-typecheck:latest
        profiles: ["typecheck"]
        restart: "no"

    status-page:
        container_name: openstatus-status-page
        build:
            context: .
            dockerfile: apps/status-page/Dockerfile
            target: runtime
            args:
                - NODE_ENV=production
                - PNPM_HOME=/pnpm
                - DATABASE_URL=http://libsql:8080
                - DATABASE_AUTH_TOKEN=test
                - NEXT_PUBLIC_OPENPANEL_CLIENT_ID=test
                - NEXT_PUBLIC_URL=https://openstatus.open.status
                - TEAM_ID_VERCEL=test
                - PROJECT_ID_VERCEL=test
                - VERCEL_AUTH_BEARER_TOKEN=test
                - OPENPANEL_CLIENT_SECRET=test
                - RESEND_API_KEY=test
                - UPSTASH_REDIS_REST_URL=https://test.upstash.io
                - UPSTASH_REDIS_REST_TOKEN=test
                - UNKEY_TOKEN=test
                - UNKEY_API_ID=test
                - TINY_BIRD_API_KEY=
                - CRON_SECRET=test
                - STRIPE_SECRET_KEY=test
                - SELF_HOST=true
        image: openstatus/status-page:latest
        networks:
            - openstatus
        ports:
            - "127.0.0.1:3003:3000"
        labels:
            - traefik.enable=true
            - traefik.http.routers.status-page.rule=Host(`status.openstat.us`)
            - traefik.http.routers.status-page.entrypoints=web,websecure
            - traefik.http.routers.status-page.tls=true
            - traefik.http.services.status-page.loadbalancer.server.port=3000
        env_file:
            - .env.docker
        environment:
            - PORT=3000
            - HOSTNAME=0.0.0.0
            - AUTH_TRUST_HOST=true
            - STATUS_PAGE_CUSTOM_DOMAIN=status.openstat.us
            - CHECKER_URL=http://checker:8080
            - UPSTASH_REDIS_REST_URL=http://redis-http:80
            - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-replace-with-a-long-random-secret}
        depends_on:
            db-migrate:
                condition: service_completed_successfully
            workflows:
                condition: service_healthy
            libsql:
                condition: service_healthy
            server:
                condition: service_healthy
            redis-http:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 45s
        restart: unless-stopped

    # ═══════════════════════════════════════════════════════════════════════
    # Comparison profile — head-to-head status page testing
    # Run: docker compose --profile comparison up --abort-on-container-exit
    # ═══════════════════════════════════════════════════════════════════════

    status-page-htmx:
        container_name: openstatus-status-page-htmx
        build:
            context: .
            dockerfile: apps/status-page-htmx/Dockerfile
            target: runtime
        image: openstatus/status-page-htmx:latest
        profiles: ["comparison"]
        networks:
            - openstatus
        ports:
            - "127.0.0.1:3004:3000"
        labels:
            - traefik.enable=true
            - traefik.http.routers.status-page-htmx.rule=Host(`status-htmx.openstat.us`)
            - traefik.http.routers.status-page-htmx.entrypoints=web,websecure
            - traefik.http.routers.status-page-htmx.tls=true
            - traefik.http.services.status-page-htmx.loadbalancer.server.port=3000
        env_file:
            - .env.docker
        environment:
            - PORT=3000
            - TRPC_URL=http://status-page:3000/api/trpc
            - NODE_ENV=production
            - SELF_HOST=true
            - LOG_LEVEL=debug
        depends_on:
            db-migrate:
                condition: service_completed_successfully
            status-page:
                condition: service_healthy
            libsql:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:3000/ping || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        restart: unless-stopped

    status-page-compare:
        container_name: openstatus-status-page-compare
        build:
            context: .
            dockerfile: scripts/Dockerfile.compare
        image: openstatus/status-page-compare:latest
        profiles: ["comparison"]
        networks:
            - openstatus
        env_file:
            - .env.docker
        environment:
            - NEXTJS_BASE=http://status-page:3000
            - HTMX_BASE=http://status-page-htmx:3000
            - TEST_SLUG=status
        depends_on:
            status-page:
                condition: service_healthy
            status-page-htmx:
                condition: service_healthy
        command: ["sh", "-c", "bun install && bun test test/comparison"]
        restart: "no"

    # ── Test profile: standalone test runner ────────────────────────────
    status-page-htmx-test:
        container_name: openstatus-status-page-htmx-test
        build:
            context: .
            dockerfile: apps/status-page-htmx/Dockerfile
            target: test
        image: openstatus/status-page-htmx-test:latest
        profiles: ["test"]
        networks:
            - openstatus
        env_file:
            - .env.docker
        environment:
            - TRPC_URL=http://status-page:3000/api/trpc
            - NODE_ENV=test
            - SELF_HOST=true
            - PAGE_SLUG=status
        depends_on:
            status-page:
                condition: service_healthy
        command: ["bun", "test", "--ignore", "test/comparison/home-comparison"]
        restart: "no"
