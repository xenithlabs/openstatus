# NOTE: After regenerating the Dockerfile with dofigen, you must manually:
#   1. Change `# syntax=docker/dockerfile:1.19.0` to `1.7-labs`
#   2. Add `--parents` to the three glob COPY instructions in deps-files
builders:
  # ── deps-files: lockfile + all workspace package.json (highly cacheable) ──
  # This stage invalidates only when pnpm-lock.yaml or any package.json changes.
  # docker build --target deps-files -q .  → "cached" or rebuild
  deps-files:
    fromImage:
      path: node
      tag: 24-slim
    workdir: /app
    arg:
      PNPM_HOME: /pnpm
    env:
      PATH: $PNPM_HOME:$PATH
    copy:
      - paths:
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - package.json
        target: /app/
      - paths:
          - apps/*/package.json
        target: /app/
      - paths:
          - packages/*/package.json
        target: /app/
      - paths:
          - packages/*/*/package.json
        target: /app/
    run:
      - corepack enable
      - pnpm install --frozen-lockfile

  # ── deps: full source (inherits deps-files cache) ──
  deps:
    fromBuilder: deps-files
    arg:
      AUTH_SECRET: build-time-placeholder-min-32-chars-long
      CRON_SECRET: test
      DATABASE_AUTH_TOKEN: test
      DATABASE_URL: http://libsql:8080
      NEXT_PUBLIC_OPENPANEL_CLIENT_ID: test
      NEXT_PUBLIC_URL: http://localhost:3002
      NODE_ENV: production
      OPENPANEL_CLIENT_SECRET: test
      PROJECT_ID_VERCEL: test
      RESEND_API_KEY: test
      SELF_HOST: "true"
      STRIPE_SECRET_KEY: test
      TEAM_ID_VERCEL: test
      TINY_BIRD_API_KEY: ""
      UNKEY_API_ID: test
      UNKEY_TOKEN: test
      UPSTASH_REDIS_REST_TOKEN: test
      UPSTASH_REDIS_REST_URL: https://test.upstash.io
      VERCEL_AUTH_BEARER_TOKEN: test
    env:
      PATH: $PNPM_HOME:$PATH
    copy:
      - paths:
          - .
        target: /app/
        link: true

  # ── deps-check: fingerprint stage to check if deps-files cache is valid ──
  deps-check:
    fromBuilder: deps-files
    run:
      - echo "deps-files cache valid"

  # ── typecheck: optional, runs tsc with high heap ──
  typecheck:
    fromBuilder: deps
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    run:
      - pnpm turbo run typecheck --filter=@openstatus/dashboard --concurrency=1

  # ── builder: main build, skips tsc via ignoreBuildErrors ──
  builder:
    fromBuilder: deps
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    run:
      - pnpm turbo run build --filter=@openstatus/dashboard --concurrency=1

# ── runtime: production image ──
fromImage:
  path: node
  tag: 24-slim
workdir: /app/apps/dashboard
copy:
  - fromBuilder: builder
    paths:
      - /app/apps/dashboard/.next/standalone/apps/dashboard/
    target: ./
    chown:
      user: "1000"
      group: "1000"
    chmod: "555"
    link: true
  - fromBuilder: builder
    paths:
      - /app/node_modules/
    target: /app/node_modules/
    chown:
      user: "1000"
      group: "1000"
    link: true
  - fromBuilder: builder
    paths:
      - /app/apps/dashboard/.next/static/
    target: ./.next/static/
    chown:
      user: "1000"
      group: "1000"
    link: true
  - fromBuilder: builder
    paths:
      - /app/apps/dashboard/public/
    target: ./public/
    chown:
      user: "1000"
      group: "1000"
    link: true

root:
  run:
    - apt-get update
    - apt-get install -y --no-install-recommends curl
    - rm -rf /var/lib/apt/lists/*

user: "1000:1000"

expose:
  - port: 3000

healthcheck:
  interval: 30s
  timeout: 10s
  start: 45s
  retries: 3
  cmd: curl -f http://localhost:3000/ || exit 1

cmd:
  - node
  - server.js
