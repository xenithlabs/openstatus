effective: |
  builders:
    deps-check:
      fromBuilder: deps-files
      run:
      - echo "deps-files cache valid"
    deps-files:
      fromImage:
        path: node
        digest: sha256:0afb7822fac7bf9d7c1bf3b6e6c496dee6b2b64d8dfa365501a3c68e8eba94b2
      label:
        org.opencontainers.image.base.name: docker.io/node:24-slim
        org.opencontainers.image.base.digest: sha256:0afb7822fac7bf9d7c1bf3b6e6c496dee6b2b64d8dfa365501a3c68e8eba94b2
      workdir: /app
      arg:
        PNPM_HOME: /pnpm
      env:
        PATH: $PNPM_HOME:$PATH
      copy:
      - paths:
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        target: /app/
      - paths:
        - apps/*/package.json
        target: /app/
      - paths:
        - packages/*/package.json
        target: /app/
      - paths:
        - packages/*/*/package.json
        target: /app/
      run:
      - corepack enable
      - pnpm install --frozen-lockfile
    builder:
      fromBuilder: deps
      env:
        NODE_OPTIONS: --max-old-space-size=2048
      run:
      - pnpm turbo run build --filter=@openstatus/status-page --concurrency=1
    typecheck:
      fromBuilder: deps
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run:
      - pnpm turbo run typecheck --filter=@openstatus/status-page --concurrency=1
    deps:
      fromBuilder: deps-files
      arg:
        TINY_BIRD_API_KEY: test
        NODE_ENV: production
        CRON_SECRET: test
        SELF_HOST: 'true'
        NEXT_PUBLIC_OPENPANEL_CLIENT_ID: test
        RESEND_API_KEY: test
        PROJECT_ID_VERCEL: test
        STRIPE_SECRET_KEY: test
        UNKEY_TOKEN: test
        TEAM_ID_VERCEL: test
        NEXT_PUBLIC_URL: http://localhost:3002
        UNKEY_API_ID: test
        UPSTASH_REDIS_REST_TOKEN: test
        DATABASE_AUTH_TOKEN: test
        VERCEL_AUTH_BEARER_TOKEN: test
        OPENPANEL_CLIENT_SECRET: test
        DATABASE_URL: http://libsql:8080
        UPSTASH_REDIS_REST_URL: https://test.upstash.io
      env:
        PATH: $PNPM_HOME:$PATH
      copy:
      - paths:
        - .
        target: /app/
        link: true
  fromImage:
    path: node
    digest: sha256:0afb7822fac7bf9d7c1bf3b6e6c496dee6b2b64d8dfa365501a3c68e8eba94b2
  label:
    org.opencontainers.image.base.name: docker.io/node:24-slim
    org.opencontainers.image.base.digest: sha256:0afb7822fac7bf9d7c1bf3b6e6c496dee6b2b64d8dfa365501a3c68e8eba94b2
    io.dofigen.version: 2.7.0
  user:
    user: '1000'
    group: '1000'
  workdir: /app/apps/status-page
  copy:
  - fromBuilder: builder
    paths:
    - /app/apps/status-page/.next/standalone/apps/status-page/
    target: ./
    chown:
      user: '1000'
      group: '1000'
    chmod: '555'
    link: true
  - fromBuilder: builder
    paths:
    - /app/node_modules/
    target: /app/node_modules/
    chown:
      user: '1000'
      group: '1000'
    link: true
  - fromBuilder: builder
    paths:
    - /app/apps/status-page/.next/static/
    target: ./.next/static/
    chown:
      user: '1000'
      group: '1000'
    link: true
  - fromBuilder: builder
    paths:
    - /app/apps/status-page/public/
    target: ./public/
    chown:
      user: '1000'
      group: '1000'
    link: true
  root:
    run:
    - apt-get update
    - apt-get install -y --no-install-recommends curl
    - rm -rf /var/lib/apt/lists/*
  cmd:
  - node
  - server.js
  expose:
  - port: 3000
  healthcheck:
    cmd: curl -f http://localhost:3000/ || exit 1
    interval: 30s
    timeout: 10s
    start: 45s
    retries: 3
images:
  docker.io:
    library:
      node:
        24-slim:
          digest: sha256:0afb7822fac7bf9d7c1bf3b6e6c496dee6b2b64d8dfa365501a3c68e8eba94b2
resources:
  dofigen.yml:
    hash: 053d6f054f808afc2e72a55c4f4a35622b176f3726cd9c7384f357442686503d
    content: |
      builders:
        # ── deps-files: lockfile + all workspace package.json (highly cacheable) ──
        # This stage invalidates only when pnpm-lock.yaml or any package.json changes.
        # docker build --target deps-files -q .  → "cached" or rebuild
        deps-files:
          fromImage:
            path: node
            tag: 24-slim
          workdir: /app
          arg:
            PNPM_HOME: /pnpm
          env:
            PATH: $PNPM_HOME:$PATH
          copy:
            - paths:
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - package.json
              target: /app/
            - paths:
                - apps/*/package.json
              target: /app/
            - paths:
                - packages/*/package.json
              target: /app/
            - paths:
                - packages/*/*/package.json
              target: /app/
          run:
            - corepack enable
            - pnpm install --frozen-lockfile

        # ── deps: full source (inherits deps-files cache) ──
        deps:
          fromBuilder: deps-files
          arg:
            CRON_SECRET: test
            DATABASE_AUTH_TOKEN: test
            DATABASE_URL: http://libsql:8080
            NEXT_PUBLIC_OPENPANEL_CLIENT_ID: test
            NEXT_PUBLIC_URL: http://localhost:3002
            NODE_ENV: production
            OPENPANEL_CLIENT_SECRET: test
            PROJECT_ID_VERCEL: test
            RESEND_API_KEY: test
            SELF_HOST: "true"
            STRIPE_SECRET_KEY: test
            TEAM_ID_VERCEL: test
            TINY_BIRD_API_KEY: test
            UNKEY_API_ID: test
            UNKEY_TOKEN: test
            UPSTASH_REDIS_REST_TOKEN: test
            UPSTASH_REDIS_REST_URL: https://test.upstash.io
            VERCEL_AUTH_BEARER_TOKEN: test
          env:
            PATH: $PNPM_HOME:$PATH
          copy:
            - paths:
                - .
              target: /app/
              link: true

        # ── deps-check: fingerprint stage to check if deps-files cache is valid ──
        # docker build --target deps-check -q . 2>&1 | grep -q cached && echo "deps fresh" || echo "deps stale"
        deps-check:
          fromBuilder: deps-files
          run:
            - echo "deps-files cache valid"

        # ── typecheck: optional, runs tsc with high heap ──
        typecheck:
          fromBuilder: deps
          env:
            NODE_OPTIONS: --max-old-space-size=4096
          run:
            - pnpm turbo run typecheck --filter=@openstatus/status-page --concurrency=1

        # ── builder: main build, skips tsc via ignoreBuildErrors in next.config.ts ──
        builder:
          fromBuilder: deps
          env:
            NODE_OPTIONS: --max-old-space-size=2048
          run:
            - pnpm turbo run build --filter=@openstatus/status-page --concurrency=1

      # ── runtime: production image ──
      fromImage:
        path: node
        tag: 24-slim
      workdir: /app/apps/status-page
      copy:
        - fromBuilder: builder
          paths:
            - /app/apps/status-page/.next/standalone/apps/status-page/
          target: ./
          chown:
            user: "1000"
            group: "1000"
          chmod: "555"
          link: true
        - fromBuilder: builder
          paths:
            - /app/node_modules/
          target: /app/node_modules/
          chown:
            user: "1000"
            group: "1000"
          link: true
        - fromBuilder: builder
          paths:
            - /app/apps/status-page/.next/static/
          target: ./.next/static/
          chown:
            user: "1000"
            group: "1000"
          link: true
        - fromBuilder: builder
          paths:
            - /app/apps/status-page/public/
          target: ./public/
          chown:
            user: "1000"
            group: "1000"
          link: true

      root:
        run:
          - apt-get update
          - apt-get install -y --no-install-recommends curl
          - rm -rf /var/lib/apt/lists/*

      user: "1000:1000"

      expose:
        - port: 3000

      healthcheck:
        interval: 30s
        timeout: 10s
        start: 45s
        retries: 3
        cmd: curl -f http://localhost:3000/ || exit 1

      cmd:
        - node
        - server.js
